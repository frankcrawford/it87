# Gigabyte it87 sensor mappings — Intel X299 Skylake-X

# SIV 0x2005080B
# Motherboards:
#   X299 UD4
#   X299 UD4 EX
#   X299 UD4 PRO
chip "it8686_2005080b-*"
    label in0     "CPU VRIN"
    label in1     "+3.3V"
    compute in1   @ * 1.649, @ / 1.649
    label in2     "+12V"
    compute in2   @ * 6, @ / 6
    label in3     "+5V"
    compute in3   @ * 2.5, @ / 2.5
    label in4     "DRAM CH(C/D)"
    label in5     "CPU VCCSA"
    label in6     "DRAM CH(A/B)"
    label temp1   "System 1"
    label temp2   "PCH"
    label temp3   "CPU"
    label temp4   "PCIEX16_1"
    label temp5   "VRM MOS"
    label temp6   "EC_TEMP1"
    label fan1    "CPU_FAN"
    label fan2    "SYS_FAN1"
    label fan3    "SYS_FAN2"
    label fan5    "CPU_OPT"
    label pwm1    "CPU_FAN"
    label pwm2    "SYS_FAN1"
    label pwm3    "SYS_FAN2"
    label pwm5    "CPU_OPT"
    # Hide only chip-supported channels not mapped by this SIV configuration.
    ignore fan4
    ignore fan6
    ignore pwm4
    ignore pwm6

