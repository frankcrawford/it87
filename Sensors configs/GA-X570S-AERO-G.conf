# Gigabyte X570S AERO G — lm-sensors configuration
# Requires: out-of-tree it87 driver (github.com/frankcrawford/it87)
#           with options it87 force_id=0x8689,0x8695
#
# Chip 1 (it8689-isa-0a40) = IT8689E  — 12.0 mV/count ADC, 6 fans, 6 temps
# Chip 2 (it87952-isa-0a60) = IT87952E — 11.0 mV/count ADC, 3 fans, 3 temps
#
# With the correct driver both chips report voltages accurately.
# The only compute directives needed are resistor dividers on chip 1 in1/in2/in3.

chip "acpitz-acpi-0"
    ignore temp1
    ignore temp2


chip "it8689-isa-0a40"

    # --- Voltages ---
    label in0 "Vcore"
    # in0: direct reading, no divider

    label in1 "+3.3V"
    compute in1 @*1.65, @/1.65 # 33/20

    label in2 "+12V"
    compute in2 @*6.0, @/6.0 # 120/20

    label in3 "+5V"
    compute in3 @*2.5, @/2.5 # 50/20

    label in4 "VCORE SOC"
    label in5 "CPU VDDP"
    label in6 "DRAM"
    # in7 (3VSB) and in8 (Vbat): labeled by driver

    # --- Fans ---
    label fan1 "CPU_FAN"
    label fan2 "SYS_FAN1"
    label fan3 "SYS_FAN2"
    label fan4 "SYS_FAN3"
    label fan5 "CPU_OPT"

    # --- Temperatures ---
    label temp1 "System1"
    label temp2 "EC_TEMP1"
    label temp3 "CPU"
    label temp4 "PCIEX16_1"
    label temp5 "VRM MOS"
    label temp6 "Chipset"


chip "it87952-isa-0a60"

    # --- Voltages ---
    # All channels read accurately with correct 11.0 mV/count ADC — no compute needed.

    # in1: ADC saturated at full-scale (255 counts), unconnected pin
    ignore in1

    # in3: NOISE_SENSOR header (silkscreen label on board), accepts bundled acoustic noise sensor.
    # PINX2 bit 0 = 1 causes driver to apply 2× scaling to this channel.
    # Default (jumper shorted): ~88 mV. Sensor attached: varies with ambient noise level.
    ignore in3
    #label in3 "NOISE_SENSOR"

    label in0 "VIN0"
    label in2 "Chipset Core"
    label in4 "CPU VDD18"
    label in5 "DDR VPP"
    label in6 "VIN6"
    # in7 (3VSB) and in8 (Vbat): labeled by driver

    # --- Fans ---
    label fan1 "SYS_FAN5_PUMP"
    label fan2 "SYS_FAN6_PUMP"
    label fan3 "SYS_FAN4"

    # --- Temperatures ---
    label temp1 "PCIEX16_2"
    label temp2 "EC_TEMP2"
    label temp3 "System2"
